<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E.A.S.T Co.</title>
<meta name="description" content="E.A.S.T Co. is an agricultural technology company that develops tools for small poultry farms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10292b;
  --ink-soft:#3f5759;
  --teal:#0f4c4f;
  --teal-deep:#0a3436;
  --yolk:#f6b800;
  --yolk-soft:#fff1bf;
  --shell:#f6f8f4;
  --sky:#dcedf0;
  --line:#cfdcdb;
  --card:#ffffff;
  --radius:18px;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e8f2f1; --ink-soft:#a9c0bf; --shell:#0b2224; --sky:#12363a;
    --line:#245055; --card:#0f2d30; --yolk-soft:#3a3210;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font-family:var(--body);font-size:1.0625rem;line-height:1.65;color:var(--ink);background:var(--shell)}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--yolk);outline-offset:3px;border-radius:6px}
.wrap{width:min(1120px,92%);margin-inline:auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:800}
h3{font-size:1.3rem;font-weight:700}
p{margin:0 0 1em}
section{padding:clamp(56px,9vw,104px) 0}
.lead{font-size:1.2rem;color:var(--ink-soft);max-width:62ch}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--shell) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none}
.brand svg{width:26px;height:30px}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav a{white-space:nowrap;display:block;padding:8px 10px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.97rem}
nav a:hover{background:var(--sky)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;color:inherit;cursor:pointer}

/* hero */
.hero{background:var(--teal-deep);color:#f2f8f6;padding:clamp(48px,8vw,96px) 0 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:800}
.hero h1 span{display:block;color:var(--yolk)}
.hero p.lead{color:#bcd5d2;margin-top:22px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-weight:600;text-decoration:none;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:600}
.btn-yolk{background:var(--yolk);color:#1d1700}
.btn-yolk:hover{background:#ffc928}
.btn-line{border-color:#5f8f8c;color:#f2f8f6;background:transparent}
.btn-line:hover{background:#12595c}
.hero-grid{grid-template-columns:1fr!important}
.hero-grid>div{max-width:760px}
.hero-plan{margin-top:40px}
.hero .plan-wrap{border-color:#1b6a6d;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.hero .plan-ctl span{color:#9fc3bf}
.hero .plan-ctl{margin-bottom:8px}
.hero-strip-unused{margin-top:48px;background:var(--yolk);color:#1d1700}
.hero-strip .wrap{display:flex;flex-wrap:wrap;gap:12px 36px;padding:16px 0;font-weight:600}

/* about */
.about{max-width:820px}
.about p{font-size:1.2rem;color:var(--ink-soft);max-width:68ch}
.about p:first-child{color:var(--ink)}

/* mission vision */
.mv{background:var(--sky)}
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}
.mv-card{background:var(--card);border-radius:var(--radius);padding:34px;border-left:8px solid var(--yolk)}
.mv-card:nth-child(2){border-left-color:var(--teal)}
.mv-card h3{font-size:1.6rem;margin-bottom:12px}
.mv-card p{margin:0;color:var(--ink-soft)}

/* activities */
.acts{background:var(--teal);color:#f2f8f6}
.acts .lead{color:#bcd5d2}
.act-list{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.act-btn{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#0c3d40;color:inherit;border:1px solid #3d7a7a;border-radius:var(--radius);padding:20px 22px;font:inherit;cursor:pointer}
.act-btn:hover{background:#12595c;border-color:var(--yolk)}
.act-btn strong{display:block;font-family:var(--display);font-size:1.15rem;font-weight:700}
.act-btn small{display:block;color:#a9c9c5;font-size:.93rem;margin-top:2px}
.act-btn .chev{flex:none;width:34px;height:34px;border-radius:50%;background:var(--yolk);color:#1d1700;display:grid;place-items:center;font-weight:800}
.tag{display:inline-block;font-size:.8rem;font-weight:600;background:var(--yolk-soft);color:#4a3a00;border-radius:999px;padding:2px 10px;margin-bottom:8px}

/* team */
.team-list{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.team-list li{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.scene{display:block;width:100%;height:auto}
.member{padding:16px 20px 20px}
.member b{display:block;font-family:var(--display);font-size:1.2rem}
.member .chip{display:inline-block;margin:6px 0 8px;font-size:.82rem;font-weight:600;background:var(--yolk-soft);color:#4a3a00;border-radius:999px;padding:2px 12px}
.member p{margin:0;color:var(--ink-soft);font-size:.98rem}

/* scene animation */
.scene .head{transform-box:fill-box;transform-origin:50% 100%;animation:headBob 2.6s ease-in-out infinite}
.st-audit .head{animation:headLook 4.8s ease-in-out infinite}
.st-maintenance .head{animation:headWork 1.6s ease-in-out infinite}
.st-docs .head{animation:headWrite 3.2s ease-in-out infinite}
@keyframes headBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2.5deg)}}
@keyframes headLook{0%,100%{transform:translateX(-7px) rotate(-6deg)}50%{transform:translateX(7px) rotate(6deg)}}
@keyframes headWork{0%,100%{transform:translateY(0) rotate(3deg)}50%{transform:translateY(3px) rotate(-3deg)}}
@keyframes headWrite{0%,100%{transform:translateY(2px) rotate(-3deg)}50%{transform:translateY(4px) rotate(3deg)}}
.arm-a{animation:armA .45s ease-in-out infinite alternate}
.arm-b{animation:armA .45s ease-in-out -.22s infinite alternate}
.arm-wrench{animation:armW .7s ease-in-out infinite alternate}
.arm-write{animation:armWrite .38s ease-in-out infinite alternate}
.arm-hold{animation:armHold 2.4s ease-in-out infinite alternate}
@keyframes armA{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes armW{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes armWrite{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes armHold{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:barGrow 2.2s ease-in-out infinite alternate}
.bar:nth-of-type(2){animation-delay:-.7s}.bar:nth-of-type(3){animation-delay:-1.4s}.bar:nth-of-type(4){animation-delay:-.3s}
@keyframes barGrow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.steam{animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.clk{transform-box:view-box;animation:spin 12s linear infinite}
.gear{transform-box:fill-box;transform-origin:50% 50%;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.belt{animation:belt .6s linear infinite}
@keyframes belt{to{stroke-dashoffset:-20}}
.belt-egg{animation:beltEgg 3.6s linear infinite}
@keyframes beltEgg{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(150px);opacity:0}}
.spark{animation:blink .5s steps(2) infinite}
.spark:nth-of-type(2){animation-delay:-.25s}
@keyframes blink{50%{opacity:0}}
.mag{animation:magMove 3.4s ease-in-out infinite alternate}
@keyframes magMove{from{transform:translateX(0)}to{transform:translateX(62px)}}
.chk{opacity:0;animation:chk 6s ease-in-out infinite}
.chk.c2{animation-delay:1.4s}.chk.c3{animation-delay:2.8s}
@keyframes chk{0%,6%{opacity:0}14%,80%{opacity:1}92%,100%{opacity:0}}
.fly{animation:fly 3.4s ease-in infinite}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-20px,-70px) rotate(-25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}.chk{opacity:1}}
@media (max-width:860px){.team-list{grid-template-columns:1fr}}

/* workspace plan */
.ws{background:var(--sky)}
.plan-wrap{position:relative;margin-top:32px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#e6efec}
.plan-wrap svg{display:block;width:100%;height:auto}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#10292b;border:2px solid #0f4c4f;border-radius:12px;padding:5px 9px;font-size:clamp(9px,1.5vw,13px);line-height:1.3;font-weight:500;width:max-content;max-width:30%;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#0f4c4f;border-bottom:0}
.bubble.on{opacity:1}
.plan-ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:18px}
.plan-ctl span{color:var(--ink-soft);font-size:.95rem}
.ws .btn-yolk{border:2px solid transparent}
.cur{animation:blink .9s steps(2) infinite}
.belt2{animation:belt .6s linear infinite}
.egg2{animation:egg2 3.6s linear infinite}
@keyframes egg2{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(220px);opacity:0}}
.pgear{transform-box:fill-box;transform-origin:50% 50%;animation:spin 3s linear infinite}
@media (prefers-reduced-motion:reduce){.plan-wrap *{animation:none!important}}

/* contact */
.contact{background:var(--teal-deep);color:#f2f8f6}
.contact .lead{color:#bcd5d2}
.contact-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
footer{background:#07292b;color:#9fc3bf;padding:22px 0;font-size:.92rem}

/* dialog */
dialog{border:0;border-radius:var(--radius);padding:0;width:min(560px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,25,27,.65)}
.dlg{padding:30px}
.dlg h3{font-size:1.6rem;margin-bottom:12px}
.dlg ul{padding-left:1.2em;color:var(--ink-soft)}
.dlg-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.dlg .btn-line{border-color:var(--line);color:var(--ink)}
.dlg .btn-line:hover{background:var(--sky)}
.note{font-size:.92rem;color:var(--ink-soft);background:var(--yolk-soft);border-radius:10px;padding:10px 14px}

@media (max-width:1060px){
  .menu-btn{display:block}
  nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--shell);border-bottom:1px solid var(--line);padding:10px 4%}
  nav ul.open{display:flex}
}
@media (max-width:860px){
  .hero-grid,.mv-grid,.act-list{grid-template-columns:1fr}
  .menu-btn{display:block}
  nav ul{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--shell);border-bottom:1px solid var(--line);padding:10px 4%}
  nav ul.open{display:flex}
  .facts div{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="E.A.S.T Co. home">
      <svg viewBox="-24 -26 48 56" aria-hidden="true"><path d="M0,-24 C14,-24 22,-4 22,10 C22,22 12,28 0,28 C-12,28 -22,22 -22,10 C-22,-4 -14,-24 0,-24Z" fill="#f6b800"/><path d="M-12,12 q12,10 24,0" stroke="#0a3436" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span data-c="brandName">E.A.S.T Co.</span>
    </a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navList">Menu</button>
    <nav aria-label="Main">
      <ul id="navList">
        <li><a href="#about">About Us</a></li>
        <li><a href="#mission">Mission &amp; Vision</a></li>
        <li><a href="#activities">Activities &amp; Projects</a></li>
        <li><a href="#team">Team</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="home">
  <div class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1 id="heroTitle"></h1>
        <p class="lead" id="heroTagline"></p>
        <div class="btns">
          <a class="btn btn-yolk" href="#activities">See our projects</a>
          <a class="btn btn-line" href="#about">About Us</a>
        </div>
      </div>
    </div>
    <div class="wrap hero-plan" id="workspace">
      <div class="plan-wrap" id="planWrap">
        <svg id="plan" viewBox="0 0 800 640" role="img" aria-label="Animated floor plan of the E.A.S.T Co. workspace: team members walk between the office desk, the prototype station, the audit table, and the documentation desk, and talk to each other. Vehicles pass on the highway outside the entrance."></svg>
        <div id="bubbles" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <section id="about">
    <div class="wrap about">
      <h2 id="aboutTitle"></h2>
      <div id="aboutText" style="margin-top:24px"></div>
    </div>
  </section>

  <section id="mission" class="mv">
    <div class="wrap">
      <h2>Mission &amp; Vision</h2>
      <div class="mv-grid">
        <article class="mv-card"><h3>Mission</h3><p id="missionText"></p></article>
        <article class="mv-card"><h3>Vision</h3><p id="visionText"></p></article>
      </div>
    </div>
  </section>

  <section id="activities" class="acts">
    <div class="wrap">
      <h2>Activities &amp; projects</h2>
      <p class="lead" style="margin-top:14px" id="actsIntro"></p>
      <ul class="act-list" id="actList"></ul>
    </div>
  </section>

  <section id="team" style="padding-top:0">
    <div class="wrap">
      <h2>The team</h2>
      <ul class="team-list" id="teamList"></ul>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="wrap">
      <h2>Get in touch</h2>
      <p class="lead" style="margin-top:14px" id="contactText"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>
</main>

<footer><div class="wrap" id="footerText"></div></footer>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg">
    <span class="tag" id="dlgTag"></span>
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <ul id="dlgPoints"></ul>
    <div id="dlgNote"></div>
    <div class="dlg-actions">
      <a class="btn btn-yolk" id="dlgLink" target="_blank" rel="noopener noreferrer">Open link</a>
      <button class="btn btn-line" id="dlgClose" type="button">Close</button>
    </div>
  </div>
</dialog>

  if (src) {
    const k = R / hd.r, im = document.createElementNS(SVGNS, "image");
    im.setAttribute("href", src);
    im.setAttribute("width", 420 * k); im.setAttribute("height", 420 * k);
    im.setAttribute("x", hx - hd.cx * k); im.setAttribute("y", hy - hd.cy * k);
    im.setAttribute("clip-path", `url(#clip${i})`);
    head.append(im);
  } else {
    const tx = document.createElementNS(SVGNS, "text");
    tx.setAttribute("x", hx); tx.setAttribute("y", hy + 8); tx.setAttribute("text-anchor", "middle");

}

  function compile(home, steps) {
    const segs = []; let t = 0, pos = home.slice(), hd = -90;
    const stay = to => { if (to > t) { segs.push({ t0: t, t1: to, x0: pos[0], y0: pos[1], x1: pos[0], y1: pos[1], h: hd, mv: 0 }); t = to; } };
    steps.forEach(s => {
      if (s.until !== undefined) stay(s.until);
      else if (s.look) hd = Math.atan2(s.look[1] - pos[1], s.look[0] - pos[0]) * 180 / Math.PI;
      else if (s.walk) s.walk.forEach(q => {
        const dx = q[0] - pos[0], dy = q[1] - pos[1], d = Math.hypot(dx, dy); if (!d) return;
        hd = Math.atan2(dy, dx) * 180 / Math.PI;
        segs.push({ t0: t, t1: t + d / SPEED, x0: pos[0], y0: pos[1], x1: q[0], y1: q[1], h: hd, mv: 1 }); t += d / SPEED; pos = q.slice();
      });
    });
    stay(T);
    return segs;
  }
  const ROUTES = {}; Object.keys(PLAN).forEach(k => ROUTES[k] = compile(HOME[k], PLAN[k]));
  function at(k, t) {
    const s = ROUTES[k]; let g = s[s.length - 1];
    for (let i = 0; i < s.length; i++) if (t < s[i].t1) { g = s[i]; break; }
    const p = g.t1 > g.t0 ? Math.min(1, Math.max(0, (t - g.t0) / (g.t1 - g.t0))) : 0;
    return { x: g.x0 + (g.x1 - g.x0) * p, y: g.y0 + (g.y1 - g.y0) * p, h: g.h, mv: g.mv };
  }

  const NS = "http://www.w3.org/2000/svg";

  /* highway traffic outside the entrance */
  const LANE_Y = { e: 600, w: 553 };
  const wheel = (x, y) => `<rect x="${x - 5}" y="${y - 2.5}" width="10" height="5" rx="2" fill="#1d2527"/>`;
  const lights = (fx, fy, bx, by) => `<circle cx="${fx}" cy="${-fy}" r="2.4" fill="#fff6b0"/><circle cx="${fx}" cy="${fy}" r="2.4" fill="#fff6b0"/><circle cx="${bx}" cy="${-by}" r="2" fill="#e5483a"/><circle cx="${bx}" cy="${by}" r="2" fill="#e5483a"/>`;
  const VEH = {

      `<rect x="-35" y="-13" width="70" height="26" rx="6" fill="${c}"/><rect x="-30" y="-10" width="52" height="20" rx="3" fill="rgba(255,255,255,.2)"/><rect x="-30" y="-1.5" width="52" height="3" fill="#f6b800"/><rect x="22" y="-13" width="13" height="26" rx="5" fill="rgba(0,0,0,.14)"/><rect x="19" y="-9" width="5" height="18" rx="2" fill="#bfe3f2"/>` + lights(34, 8, -34, 8) },
    truck: { L: 92, w: 1.2, svg: c => wheel(-32, -14) + wheel(-32, 14) + wheel(-16, -14) + wheel(-16, 14) + wheel(34, -14) + wheel(34, 14) +
      `<rect x="-46" y="-13" width="68" height="26" rx="3" fill="#e9e4d6" stroke="#b8b19e" stroke-width="1.5"/><path d="M-30,-13V13M-14,-13V13M2,-13V13" stroke="#cfc8b4" stroke-width="1.5"/><rect x="24" y="-12" width="22" height="24" rx="5" fill="${c}"/><rect x="38" y="-9" width="5" height="18" rx="2" fill="#bfe3f2"/>` + lights(45, 8, -45, 9) },

      `<rect x="-50" y="-14" width="100" height="28" rx="8" fill="${c}"/><rect x="-42" y="-11" width="80" height="22" rx="4" fill="rgba(255,255,255,.25)"/><rect x="-32" y="-5" width="10" height="10" rx="2" fill="rgba(255,255,255,.5)"/><rect x="-10" y="-5" width="10" height="10" rx="2" fill="rgba(255,255,255,.5)"/><rect x="12" y="-5" width="10" height="10" rx="2" fill="rgba(255,255,255,.5)"/><rect x="40" y="-11" width="6" height="22" rx="2" fill="#bfe3f2"/>` + lights(49, 9, -49, 9) },
    moto: { L: 24, w: 2.4, svg: c => `<rect x="-12" y="-1.8" width="9" height="3.6" rx="1.8" fill="#1d2527"/><rect x="5" y="-1.8" width="9" height="3.6" rx="1.8" fill="#1d2527"/><rect x="-9" y="-3" width="18" height="6" rx="3" fill="${c}"/><ellipse cx="-1" cy="0" rx="3.5" ry="8" fill="#26343a"/><circle cx="1" cy="0" r="4.6" fill="${c}" stroke="#fff" stroke-width="1"/><path d="M8,-7V7" stroke="#1d2527" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="0" r="1.6" fill="#fff6b0"/>` },
    trike: { L: 36, w: 1.8, svg: c => `<rect x="-14" y="-12" width="10" height="4" rx="2" fill="#1d2527"/><rect x="-14" y="8" width="10" height="4" rx="2" fill="#1d2527"/><rect x="11" y="-1.8" width="9" height="3.6" rx="1.8" fill="#1d2527"/><rect x="-19" y="-9" width="27" height="18" rx="5" fill="${c}"/><rect x="-16" y="-7" width="21" height="14" rx="3" fill="rgba(255,255,255,.28)"/><rect x="8" y="-3" width="10" height="6" rx="3" fill="#26343a"/><circle cx="12" cy="0" r="4.4" fill="#f6b800" stroke="#fff" stroke-width="1"/><circle cx="19" cy="0" r="1.6" fill="#fff6b0"/><circle cx="-19" cy="-5" r="1.8" fill="#e5483a"/><circle cx="-19" cy="5" r="1.8" fill="#e5483a"/>` }
  };
  const PAL = ["#d94f3a", "#2f7fd0", "#f6b800", "#2f8f5a", "#8e5bd6", "#e8e8e8", "#1f2f45", "#f08a24", "#e0587f"];
  const traffic = svg.querySelector("#traffic"), cars = [], NEXT = { e: 0.6, w: 1.8 };
  function pickType() {
    const keys = Object.keys(VEH), tot = keys.reduce((a, k) => a + VEH[k].w, 0); let r = Math.random() * tot;
    for (const k of keys) { r -= VEH[k].w; if (r <= 0) return k; } return "car";
  }
  function addCar(lane, x, leader) {
    const type = pickType(), v = VEH[type], col = PAL[Math.floor(Math.random() * PAL.length)];
    const base = type === "moto" ? 150 : type === "trike" ? 100 : type === "car" ? 125 : type === "jeepney" ? 110 : 90;
    let speed = base * (0.85 + Math.random() * 0.3);
    if (leader && Math.abs(leader.x - x) < 320) speed = Math.min(speed, leader.speed);
    const g = document.createElementNS(NS, "g"); g.innerHTML = v.svg(col); traffic.append(g);
    const c = { g, lane, dir: lane === "e" ? 1 : -1, x, speed, L: v.L };
    cars.push(c); place(c); return c;
  }
  function place(c) { c.g.setAttribute("transform", `translate(${c.x.toFixed(1)},${LANE_Y[c.lane]}) scale(${c.dir},1)`); }
  function lastIn(lane) { const l = cars.filter(c => c.lane === lane); if (!l.length) return null; return l.reduce((a, b) => (lane === "e" ? (b.x < a.x ? b : a) : (b.x > a.x ? b : a))); }
  function seedTraffic() {
    let x = 770, lead = null;
    while (x > -40) { lead = addCar("e", x, lead); x -= 170 + Math.random() * 120 + lead.L; }
    x = 30; lead = null;
    while (x < 840) { lead = addCar("w", x, lead); x += 170 + Math.random() * 120 + lead.L; }
  }
  function updateTraffic(dt) {
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i]; c.x += c.dir * c.speed * dt; place(c);
      if (c.x > 920 || c.x < -120) { c.g.remove(); cars.splice(i, 1); }
    }
    ["e", "w"].forEach(lane => {
      NEXT[lane] -= dt; if (NEXT[lane] > 0) return;
      const last = lastIn(lane), start = lane === "e" ? -70 : 870;
      if (last && Math.abs(last.x - start) < 190 + last.L) { NEXT[lane] = 0.3; return; }
      addCar(lane, start, last); NEXT[lane] = 1.2 + Math.random() * 2.8;
    });
  }
  seedTraffic();

  /* characters */
  const chars = svg.querySelector("#chars"), people = {};
  Object.keys(WHO).forEach((k, n) => {
    const m = C.team[WHO[k]]; if (!m) return;

    const g = document.createElementNS(NS, "g");
    const kk = 16 / hd.r, src = m.photo ? (IMG[m.photo] || m.photo) : "";
    const laptop = k === "lira" ? `<rect x="11" y="-9" width="13" height="18" rx="2" fill="#4b5b5e" stroke="#2f3c3e" stroke-width="1.5"/><circle cx="17" cy="0" r="2.5" fill="#f6b800"/>` : "";
    g.innerHTML = `<ellipse cx="0" cy="6" rx="22" ry="14" fill="rgba(0,0,0,.16)"/>
      <g class="rot"><ellipse rx="8" ry="17" fill="${hd.outfit}"/><circle class="hl" cx="0" cy="-19" r="5.5" fill="${hd.skin}"/><circle class="hr" cx="0" cy="19" r="5.5" fill="${hd.skin}"/>${laptop}</g>

      <circle cx="0" cy="-5" r="17.5" fill="none" stroke="${hd.outfit}" stroke-width="2.5"/>
      ${k === "jhon" ? `<path d="M-16,-12 Q-16,-30 0,-31 Q16,-30 16,-12Z" fill="#f6b800"/><rect x="-19" y="-14" width="38" height="4" rx="2" fill="#d99a00"/>` : ""}</g>
      <text y="34" text-anchor="middle" font-size="11" font-weight="700" font-family="Figtree,sans-serif" fill="#10292b" stroke="#fff" stroke-width="3" paint-order="stroke">${m.name.split(" ")[0]}</text>`;
    chars.append(g);
    const b = document.createElement("div"); b.className = "bubble"; layer.append(b);
    people[k] = { g, rot: g.querySelector(".rot"), face: g.querySelector(".face"), hl: g.querySelector(".hl"), hr: g.querySelector(".hr"), bub: b, h: 0, ph: 0, x: 0, y: 0 };
  });
  const legend = [];
  Object.keys(people).forEach(k => legend.push(C.team[WHO[k]].name.split(" ")[0] + " (" + C.team[WHO[k]].role.toLowerCase() + ")"));

  /* clock */
  let running = !matchMedia("(prefers-reduced-motion: reduce)").matches, visible = true, t0 = performance.now(), offset = running ? 0 : 0, last = performance.now(), frozenAt = 0, force = null;
  new IntersectionObserver(es => visible = es[0].isIntersecting).observe($("planWrap"));

  function draw(time, dt) {
    const ct = time % T;
    Object.keys(people).forEach(k => {
      const p = people[k], s = at(k, ct);
      let d = ((s.h - p.h + 540) % 360) - 180; p.h += d * Math.min(1, dt * 10);
      if (s.mv) p.ph += dt * 11;
      const sw = s.mv ? Math.sin(p.ph) * 6 : 0, bob = s.mv ? Math.abs(Math.sin(p.ph)) * -2 : 0;
      p.g.setAttribute("transform", `translate(${s.x.toFixed(1)},${s.y.toFixed(1)})`);
      p.rot.setAttribute("transform", `rotate(${p.h.toFixed(1)})`);
      p.hl.setAttribute("cx", sw); p.hr.setAttribute("cx", -sw);
      p.face.setAttribute("transform", `translate(0,${bob})`);
      p.x = s.x; p.y = s.y;
    });
    const talking = {};
    TALK.forEach(([k, a, b, txt, side]) => { if (ct >= a && ct < b && people[k]) talking[k] = { txt, side }; });
    Object.keys(people).forEach(k => {
      const p = people[k], tk = talking[k];
      if (tk) {
        if (p.bub.textContent !== tk.txt) p.bub.textContent = tk.txt;
        const side = tk.side || "", dx = side === "r" ? 30 : side === "l" ? -30 : 0;
        p.bub.style.left = Math.min(side ? 100 : 80, Math.max(side ? 0 : 17, (p.x + dx) / W * 100)) + "%";
        p.bub.style.top = ((side ? p.y + 4 : p.y - 30) / H * 100) + "%";
        p.bub.style.transform = side === "r" ? "translate(0,-50%)" : side === "l" ? "translate(-100%,-50%)" : "";
        p.bub.classList.add("on");
      }
      else p.bub.classList.remove("on");
    });
  }
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (running && visible) { draw((now - t0) / 1000, dt); updateTraffic(dt); }
    requestAnimationFrame(frame);
  }
  draw(running ? 0 : 6, .016);
  requestAnimationFrame(frame);
})();
